<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRutas - Explora lo inexplorado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        /* Estilo para que el mapa no se vea gris */
        .leaflet-container { background: #1a1a1a; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800">

    <nav class="absolute top-0 w-full p-6 flex justify-between items-center z-[1001]">
        <div class="text-2xl font-bold text-white tracking-wider">
            <i class="fa-solid fa-mountain text-green-400"></i> EcoRutas
        </div>
        <div class="flex gap-6 items-center">
            <a href="/" class="text-white hover:text-green-300 font-medium">Inicio</a>
            <a href="/mapa" class="bg-green-600 text-white px-6 py-2 rounded-full font-bold hover:bg-green-700 transition shadow-lg">Explorar Mapa</a>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
